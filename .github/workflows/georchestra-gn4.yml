name: Building georchestra-geonetwork4 artifacts

on:
  push:
    branches:
    - georchestra-gn4.2.x
  pull_request:
  workflow_dispatch:

env:
  DOCKER_TAG: 4.2.x

jobs:
  build:
    if: "!startsWith(github.event.head_commit.message, '[skip ci] ')"
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
    - name: "Checking out"
      uses: actions/checkout@v2.4.0
      with:
        submodules: 'recursive'

    - name: "Checking out geOrchestra (needed for building dependencies)"
      uses: actions/checkout@v2.4.0
      with:
        repository: "georchestra/georchestra"
        path: "georchestra"

    - name: "Setting up Java"
      uses: actions/setup-java@v2
      with:
        java-version: '11'
        distribution: 'adopt'

    - name: "Installing the geOrchestra root pom"
      run: |
          mvn install --non-recursive -f georchestra/pom.xml

    - name: "Installing testcontainers georchestra module"
      run: |
          mvn clean install -f georchestra/testcontainers/pom.xml

    - name: "Installing georchestra commons module"
      run: |
          mvn clean install -f georchestra/commons/pom.xml

    - name: "Installing security-proxy-spring-integration georchestra module"
      run: |
          mvn clean install -f georchestra/security-proxy-spring-integration/pom.xml

    - name: "Installing GeoNetwork"
      run: mvn clean install -DskipTests

    - name: "run tests"
      run: mvn verify -Pit

    - name: "Run Georchestra Integration Tests"
      working-directory: geonetwork/georchestra-integration/
      run: mvn verify -ntp -Dadditionalparam=-Xdoclint:none

    - name: "Build GeoNetwork docker image"
      if: github.repository == 'georchestra/georchestra' && github.actor != 'dependabot[bot]'
      run: |
        cd geonetwork/web
        mvn package docker:build -Pdocker -DdockerImageName=georchestra/geonetwork -DdockerImageTags=${{ steps.version.outputs.VERSION }},latest -DskipTests -ntp
    - name: "Logging in docker.io"
      uses: azure/docker-login@v1
      if: github.repository == 'georchestra/georchestra' && github.actor != 'dependabot[bot]' && github.event_name != 'pull_request'
      with:
        username: '${{ secrets.DOCKER_HUB_USERNAME }}'
        password: '${{ secrets.DOCKER_HUB_PASSWORD }}'

    - name: "Pushing latest to docker.io"
      if: github.ref == 'refs/heads/master' && github.repository == 'georchestra/georchestra' && github.actor != 'dependabot[bot]' && github.event_name != 'pull_request'
      run: |
        docker push georchestra/geonetwork:latest
    - name: "publish the webapp as artifact"
      if: github.repository == 'georchestra/geonetwork' && github.actor != 'dependabot[bot]' && github.ref == 'refs/heads/georchestra-gn4.2.x' && github.event_name != 'pull_request'
      uses: actions/upload-artifact@v4
      with:
        name: geonetwork.war
        path: web/target/geonetwork.war
